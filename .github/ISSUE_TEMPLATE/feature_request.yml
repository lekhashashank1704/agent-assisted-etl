name: Feature proposal
description: Propose a bounded change with acceptance criteria.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended user
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, compatibility and operational considerations
