name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -c requirements/constraints.txt -e . pip-audit
      - run: python -m pip_audit -r requirements/constraints.txt --no-deps --disable-pip --strict --progress-spinner off
