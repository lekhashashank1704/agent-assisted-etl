[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "etl-agents"
version = "0.2.0"
description = "Governed schema planning and deterministic ETL with approvals and transactional recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["etl", "schema-drift", "data-quality", "sqlite", "openai", "approvals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["openai>=2.54,<4"]

[project.urls]
Repository = "https://github.com/lekhashashank1704/agent-assisted-etl"
Issues = "https://github.com/lekhashashank1704/agent-assisted-etl/issues"
Documentation = "https://github.com/lekhashashank1704/agent-assisted-etl/tree/main/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "coverage[toml]>=7.10,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "build>=1.2,<2",
    "setuptools>=77",
    "wheel>=0.45",
    "bandit[toml]>=1.8,<2",
    "pip-audit>=2.8,<3",
]

[project.scripts]
etl-agents = "etl_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etl_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["etl_agents"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/etl_agents"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.bandit]
targets = ["src/etl_agents"]
